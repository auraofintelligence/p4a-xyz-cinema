<!doctype html><html lang="en-AU"><meta charset="utf-8"><title>Queensland tablet and phone checks</title><style>body{font:16px system-ui;margin:18px;background:#ddd}iframe{display:block;height:750px;border:2px solid #555;margin-bottom:25px}pre{white-space:pre-wrap}</style><h1>Map and tablet checks, 17 October 2026</h1><p>Local QA fixture only.</p><h2>680px Redlands navigation</h2><iframe style="width:680px" title="680px Redland navigation" src="../../states/qld/councils/redland/index.html"></iframe><h2>390px map at synthetic DPR2</h2><iframe style="width:390px" title="390px QLD map DPR2" src="council-map.html?dpr=2"></iframe><h2>390px division map at synthetic DPR2</h2><iframe style="width:390px" title="390px division map DPR2" src="division-map.html?dpr=2"></iframe><pre data-testid="layout-metrics"></pre><script>const reports=[];document.querySelectorAll('iframe').forEach(f=>f.addEventListener('load',()=>{const d=f.contentDocument;const links=[...d.querySelectorAll('.local-nav a,.atlas-toolbar button')];const boxes=links.map(el=>el.getBoundingClientRect());let overlaps=0;for(let i=0;i<boxes.length;i++)for(let j=i+1;j<boxes.length;j++){const a=boxes[i],b=boxes[j];if(a.left<b.right-1&&a.right>b.left+1&&a.top<b.bottom-1&&a.bottom>b.top+1)overlaps++;}reports.push({page:f.title,viewport:d.documentElement.clientWidth,scrollWidth:d.documentElement.scrollWidth,buttonOverlaps:overlaps,canvas:[...d.querySelectorAll('canvas.atlas-canvas')].map(c=>({cssWidth:c.getBoundingClientRect().width,bitmapWidth:c.width})),picking:d.querySelector('[data-testid=qld-map-tests]')?.textContent});document.querySelector('[data-testid=layout-metrics]').textContent=JSON.stringify(reports,null,2);}));</script></html>
