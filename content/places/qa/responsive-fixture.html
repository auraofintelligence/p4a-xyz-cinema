<!doctype html><html lang="en-AU"><meta charset="utf-8"><title>Local civic browser review</title>
<style>body{margin:16px;font:15px system-ui;background:#ddd;color:#222}label{margin-right:12px}input{width:440px;max-width:90vw}button,select,input{font:inherit;padding:8px}iframe{display:block;height:780px;border:1px solid #555;margin-top:16px;background:#20102e}pre{white-space:pre-wrap;max-width:1100px;max-height:180px;overflow:auto}h1{font-size:22px}</style>
<h1>Local civic browser review · 17 October 2026</h1><p>Real browser frames at measured CSS widths. This fixture does not emulate a phone, physical touch or device pixel ratio.</p>
<form id="controls"><label>Local page <input id="path" value="/states/qld/councils/index.html"></label><label>Frame width <select id="width"><option>390</option><option>680</option><option selected>1200</option></select></label><button>Load preview</button><button type="button" id="measure">Measure</button></form>
<pre id="metrics">Load a page, review it, then measure the settled layout.</pre><iframe id="preview" title="Civic place browser preview" width="1200" src="/states/qld/councils/index.html"></iframe>
<script>
const frame=document.querySelector('#preview'),path=document.querySelector('#path'),width=document.querySelector('#width');
document.querySelector('#controls').addEventListener('submit',event=>{event.preventDefault();if(!path.value.startsWith('/')||path.value.startsWith('//'))return;frame.width=width.value;frame.src=path.value;document.querySelector('#metrics').textContent='Review the loaded page, then Measure.';});
document.querySelector('#measure').addEventListener('click',async()=>{const d=frame.contentDocument,w=frame.contentWindow;await d.fonts.ready;await new Promise(resolve=>w.requestAnimationFrame(resolve));const visible=selector=>[...d.querySelectorAll(selector)].filter(n=>n.getBoundingClientRect().width&&n.getBoundingClientRect().height);const buttons=visible('.civic-map-tools button,.civic-map-tools select,.atlas-toolbar button').map(n=>n.getBoundingClientRect());let overlaps=0;for(let i=0;i<buttons.length;i++)for(let j=i+1;j<buttons.length;j++){const a=buttons[i],b=buttons[j];if(a.left<b.right-1&&a.right>b.left+1&&a.top<b.bottom-1&&a.bottom>b.top+1)overlaps++;}document.querySelector('#metrics').textContent=JSON.stringify({path:w.location.pathname+w.location.search,requestedWidth:Number(frame.width),innerWidth:w.innerWidth,clientWidth:d.documentElement.clientWidth,scrollWidth:d.documentElement.scrollWidth,devicePixelRatio:w.devicePixelRatio,controlsMeasured:buttons.length,controlOverlaps:overlaps,h1:d.querySelector('h1')?.innerText,canvas:visible('canvas').map(n=>({cssWidth:n.getBoundingClientRect().width,bitmapWidth:n.width,cssHeight:n.getBoundingClientRect().height})),search:d.querySelector('input[type=search]')?.value},null,2);});
</script></html>
