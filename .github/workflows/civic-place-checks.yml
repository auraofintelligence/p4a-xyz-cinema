name: Civic place checks

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  source-and-journey-checks:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: '3.13'
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          package-manager-cache: false
      - name: Check Markdown builder fields and saved drafts
        run: |
          node --test tests/p4a-builders.test.mjs
          node --check assets/p4a-builders.js
      - name: Check the private law research questionnaire
        run: |
          node --test tests/your-relevance.test.mjs
          node --check assets/your-relevance.mjs
      - name: Check national pages without replacing reviewed evidence
        run: python -B tools/verify-national-places.py --source-hashes --no-write
      - name: Check every registered council, state and federal contract
        run: |
          python tools/check-contract-cache.py
          python tools/verify-place-contracts.py
      - name: Check the Redlands reference build
        run: |
          python tools/verify-redland.py
          python tools/verify-redland-election.py
      - name: Check favicon paths on public pages and source mirrors
        run: |
          python tools/check-favicons.py
          python -m unittest discover -s tests -p test_favicons.py
      - name: Check maintenance records and date semantics
        run: |
          python tools/check-site-maintenance.py
          python -m unittest discover -s tests -p test_page_review_dates.py
          python -m unittest discover -s tests -p test_state_clock_parity.py
          python -m unittest discover -s tests -p test_national_contract_dates.py
          node --test tests/election-timing-confirmation.test.mjs
      - name: Check public discovery and preserved licence
        run: |
          python tools/check-civic-navigation.py
          python tools/verify-discovery.py
      - name: Check the existing Victoria atlas
        run: |
          python tools/verify-vic-map.py
          python tools/verify-vic-numbers.py
          python tools/verify-vic-councils.py
      - name: Check election clock behavior and map script
        run: |
          node tools/check-redland-clock.mjs
          node --test tests/redland-election.test.mjs
          node --check assets/qld-council-map.js
      - name: Check national map geometry, delivery and local clocks
        run: |
          node tools/check-civic-geometry.mjs
          node tools/check-civic-delivery.mjs
          node tools/check-civic-clocks.mjs
